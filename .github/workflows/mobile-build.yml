name: Build Android companion

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-build.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: Test paging
        run: bun test mobile/tests/page.test.ts
      - name: Build and lint Android
        working-directory: mobile/android
        run: bash gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: lumiverse-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
